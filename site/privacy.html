<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Какие данные хранит Чекер</title>
  <style>
    body {
      margin: 0;
      padding: 24px 16px 48px;
      background: #f4f5f7;
      color: #1f2328;
      font: 15px/1.55 -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
    }
    main { max-width: 680px; margin: 0 auto; padding: 24px; border-radius: 12px; background: #fff; }
    h1 { margin-top: 0; font-size: 22px; }
    h2 { margin-top: 28px; font-size: 17px; }
    li { margin: 4px 0; }
    p:last-child { color: #6b7280; font-size: 13px; } /* строка «Последнее обновление» */
  </style>
</head>
<body>
  <!-- Сам текст лежит рядом, в privacy.md: его правят как обычный текст, без разметки страницы.
       Разбор простой и намеренно неполный — ровно то, что встречается в этом файле:
       заголовки, списки, абзацы и **жирный**. -->
  <main id="text">Загружаем…</main>

  <script>
    const escape = (s) => s.replace(/[&<>]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;' })[c]);
    const inline = (s) => escape(s).replace(/\*\*(.+?)\*\*/g, '<b>$1</b>');

    function render(md) {
      const html = [];
      let list = false;
      for (const line of md.split('\n')) {
        const text = line.trim();
        if (text.startsWith('- ')) {
          if (!list) html.push('<ul>');
          list = true;
          html.push(`<li>${inline(text.slice(2))}</li>`);
          continue;
        }
        if (list) {
          html.push('</ul>');
          list = false;
        }
        if (!text) continue;
        if (text.startsWith('## ')) html.push(`<h2>${inline(text.slice(3))}</h2>`);
        else if (text.startsWith('# ')) html.push(`<h1>${inline(text.slice(2))}</h1>`);
        else html.push(`<p>${inline(text)}</p>`);
      }
      if (list) html.push('</ul>');
      return html.join('\n');
    }

    fetch('/privacy.md')
      .then((res) => (res.ok ? res.text() : Promise.reject(new Error(`HTTP ${res.status}`))))
      .then((md) => {
        document.getElementById('text').innerHTML = render(md);
        const first = document.querySelector('h1');
        if (first) document.title = first.textContent;
      })
      .catch(() => {
        document.getElementById('text').textContent = 'Текст не загрузился. Обновите страницу.';
      });
  </script>
</body>
</html>
