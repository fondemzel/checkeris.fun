<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex" />
  <title>Кабинет — Чекер</title>
  <link rel="stylesheet" href="/cabinet/styles.css" />
</head>
<body>
  <div class="login" id="login" hidden>
    <form class="login-box" id="login-form">
      <div class="login-title">Чекер</div>
      <p class="dim" id="login-note">Кабинет закрыт: внутри личные чеки</p>
      <input id="login-name" type="text" placeholder="Логин" autocomplete="username" required />
      <input id="login-pass" type="password" placeholder="Пароль" autocomplete="current-password" required />
      <button class="btn" id="login-submit" type="submit">Войти</button>
    </form>
  </div>

  <div class="app" id="app" hidden>
    <nav class="sidebar">
      <a class="sidebar-brand" href="/">Чекер <span>Кабинет</span></a>
      <button class="nav-item" type="button" data-view="receipts" aria-current="true">Чеки</button>
      <button class="nav-item" type="button" data-view="items">Товары</button>
      <button class="nav-item" type="button" data-view="analysis">Анализ</button>
      <button class="nav-item" type="button" data-view="taxonomy">Категории</button>
      <div class="sidebar-foot">
        <div id="data-period">загрузка данных…</div>
        <div id="last-import"></div>
        <button class="nav-logout" id="logout" type="button">Выйти</button>
      </div>
    </nav>

    <main class="content">
      <header class="content-head">
        <h1 id="page-title">Чеки</h1>
        <div class="content-head-actions">
          <input id="f-q" type="search" placeholder="Поиск: товар, продавец, точка" autocomplete="off" />
          <button class="btn" id="export-btn" type="button">Экспорт CSV</button>
        </div>
      </header>

      <div class="layout">
        <section class="list-pane">
          <div class="filters" aria-label="Фильтры">
            <div class="chips" id="chips-period" role="group" aria-label="Период">
              <button class="chip" type="button" data-period="" aria-pressed="true">Все</button>
              <button class="chip" type="button" data-period="day">День</button>
              <button class="chip" type="button" data-period="week">Неделя</button>
              <button class="chip" type="button" data-period="month">Месяц</button>
              <button class="chip" type="button" data-period="year">Год</button>
              <div class="chips-range">
                <button class="arrow-btn" id="period-prev" type="button" title="Предыдущий период" aria-label="Предыдущий период">‹</button>
                <button class="arrow-btn" id="period-next" type="button" title="Следующий период" aria-label="Следующий период">›</button>
                <input id="f-from" type="date" aria-label="Период с" />
                <span class="chips-dash">—</span>
                <input id="f-to" type="date" aria-label="Период по" />
              </div>
            </div>

            <div class="chips" id="chips-group" role="group" aria-label="Группа категорий" hidden></div>
            <div class="chips" id="chips-category" role="group" aria-label="Категория" hidden></div>

            <div class="chips" id="chips-sum" role="group" aria-label="Сумма">
              <button class="chip" type="button" data-sum="" aria-pressed="true">Все</button>
              <button class="chip" type="button" data-sum="100">100 ₽</button>
              <button class="chip" type="button" data-sum="1000">1 000 ₽</button>
              <button class="chip" type="button" data-sum="5000">5 000 ₽</button>
              <button class="chip" type="button" data-sum="10000">10 000 ₽</button>
              <button class="chip" type="button" data-sum="50000">50 000 ₽</button>
              <button class="chip" type="button" data-sum="100000">100 000 ₽</button>
              <label class="check"><input type="radio" name="sum-dir" id="f-less" value="less" />и меньше</label>
              <label class="check"><input type="radio" name="sum-dir" id="f-more" value="more" />и больше</label>
              <div class="chips-range">
                <input id="f-min" type="number" min="0" step="1" placeholder="от, ₽" aria-label="Сумма от" />
                <span class="chips-dash">—</span>
                <input id="f-max" type="number" min="0" step="1" placeholder="до, ₽" aria-label="Сумма до" />
                <button class="arrow-btn" id="reset-btn" type="button" title="Сбросить фильтры" aria-label="Сбросить фильтры">✕</button>
              </div>
            </div>
          </div>

          <div class="totals" aria-live="polite">
            <span id="totals-left">—</span>
            <span id="totals-right"></span>
          </div>

          <div class="table-card">
            <div class="table-scroll">
              <table id="table">
                <thead id="thead"></thead>
                <tbody id="tbody"></tbody>
              </table>
            </div>
            <div class="state" id="state" hidden></div>
            <div class="table-foot">
              <span id="range-info">—</span>
              <span id="load-info" class="dim"></span>
            </div>
          </div>
        </section>

        <section class="analysis-pane" id="analysis-pane" hidden>
          <div class="period">
            <button class="arrow-btn" id="year-prev" type="button" aria-label="Предыдущий год">‹</button>
            <span class="period-name" id="period-name">—</span>
            <button class="arrow-btn" id="year-next" type="button" aria-label="Следующий год">›</button>
            <button class="chip" id="period-all" type="button">Всё время</button>
          </div>
          <div class="analysis-scroll" id="analysis"></div>
        </section>

        <section class="tree-pane" id="tree-pane" hidden>
          <div class="tree-head">
            <span class="dim" id="tree-info">загрузка справочника…</span>
            <button class="btn" id="add-group" type="button">+ Группа</button>
          </div>
          <div class="table-card">
            <div class="tree-scroll" id="tree"></div>
          </div>
        </section>

        <aside class="detail-pane" id="detail" aria-live="polite"></aside>
      </div>
    </main>
  </div>

  <script type="module" src="/cabinet/app.js"></script>
</body>
</html>
