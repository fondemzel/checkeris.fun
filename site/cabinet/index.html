<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex" />
  <title>Кабинет — Чекер</title>
  <link rel="stylesheet" href="/cabinet/styles.css" />
</head>
<body>
  <div class="app">
    <nav class="sidebar">
      <a class="sidebar-brand" href="/">Чекер <span>Кабинет</span></a>
      <button class="nav-item" type="button" data-view="receipts" aria-current="true">Чеки</button>
      <button class="nav-item" type="button" data-view="items">Товары</button>
      <div class="sidebar-foot">
        <div id="data-period">загрузка данных…</div>
        <div id="last-import"></div>
      </div>
    </nav>

    <main class="content">
      <header class="content-head">
        <h1 id="page-title">Чеки</h1>
        <div class="content-head-actions">
          <input id="f-q" type="search" placeholder="Поиск: товар, продавец, точка" autocomplete="off" />
          <button class="btn" id="export-btn" type="button">Экспорт CSV</button>
        </div>
      </header>

      <div class="filters" aria-label="Фильтры">
        <div class="chips" id="chips-period" role="group" aria-label="Период">
          <button class="chip" type="button" data-period="" aria-pressed="true">Все</button>
          <button class="chip" type="button" data-period="day">День</button>
          <button class="chip" type="button" data-period="week">Неделя</button>
          <button class="chip" type="button" data-period="month">Месяц</button>
          <button class="chip" type="button" data-period="year">Год</button>
          <input id="f-from" type="date" aria-label="Период с" />
          <span class="chips-dash">—</span>
          <input id="f-to" type="date" aria-label="Период по" />
        </div>

        <div class="chips" id="chips-sum" role="group" aria-label="Сумма">
          <button class="chip" type="button" data-max="" aria-pressed="true">Все</button>
          <button class="chip" type="button" data-max="100">до 100 ₽</button>
          <button class="chip" type="button" data-max="1000">до 1 000 ₽</button>
          <button class="chip" type="button" data-max="5000">до 5 000 ₽</button>
          <button class="chip" type="button" data-max="10000">до 10 000 ₽</button>
          <button class="chip" type="button" data-max="50000">до 50 000 ₽</button>
          <button class="chip" type="button" data-max="100000">до 100 000 ₽</button>
          <button class="btn chips-reset" id="reset-btn" type="button">Сбросить</button>
        </div>
      </div>

      <div class="layout">
        <section class="list-pane">
          <div class="totals" aria-live="polite">
            <span id="totals-left">—</span>
            <span id="totals-right"></span>
          </div>

          <div class="table-card">
            <div class="table-scroll">
              <table id="table">
                <thead id="thead"></thead>
                <tbody id="tbody"></tbody>
              </table>
            </div>
            <div class="state" id="state" hidden></div>
            <div class="table-foot">
              <span id="range-info">—</span>
              <span id="load-info" class="dim"></span>
            </div>
          </div>
        </section>

        <aside class="detail-pane" id="detail" aria-live="polite"></aside>
      </div>
    </main>
  </div>

  <script type="module" src="/cabinet/app.js"></script>
</body>
</html>
