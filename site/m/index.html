<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#131a26" />
  <meta name="robots" content="noindex" />
  <title>Чекер</title>
  <link rel="stylesheet" href="/m/styles.css" />
</head>
<body>
  <div class="login" id="login" hidden>
    <form class="login-box" id="login-form">
      <div class="login-title">Чекер</div>
      <p class="note" id="login-note">Внутри личные чеки</p>
      <input id="login-name" type="text" placeholder="Логин" autocomplete="username" required />
      <input id="login-pass" type="password" placeholder="Пароль" autocomplete="current-password" required />
      <button class="btn primary" id="login-submit" type="submit">Войти</button>
    </form>
  </div>

  <div class="app" id="app" hidden>
    <header class="bar">
      <button class="bar-back" id="back" type="button" hidden aria-label="Назад">‹</button>
      <div class="bar-title" id="title">Расходы</div>
      <button class="bar-action" id="logout" type="button" aria-label="Выйти">⏻</button>
    </header>

    <main class="screen" id="screen"></main>
  </div>

  <script type="module" src="/m/app.js"></script>
</body>
</html>
