<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="robots" content="noindex" />
  <meta name="theme-color" content="#131a26" />
  <title>Вход в Чекер</title>
  <style>
    html, body { height: 100%; margin: 0; }
    body {
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      box-sizing: border-box;
      background: #f4f5f7;
      color: #1f2328;
      font: 15px/1.45 -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
    }
    main { width: 100%; max-width: 340px; padding: 26px 22px; border-radius: 14px; background: #fff; text-align: center; }
    .ic { width: 52px; height: 52px; margin: 0 auto 12px; color: #2aabee; }
    .ic.ok { color: #1baf7a; }
    .ic.bad { color: #b42318; }
    h1 { margin: 0 0 6px; font-size: 19px; }
    p { margin: 0; color: #6b7280; }

    /* Что дальше: три строки о том, ради чего всё затевалось */
    .can { margin: 16px 0 0; padding: 0; list-style: none; text-align: left; }
    .can li { display: flex; flex-direction: column; gap: 2px; padding: 8px 0; border-top: 1px solid #f0f1f3; font-size: 14px; }
    .can li:first-child { border-top: none; }
    .can b { display: block; font-weight: 600; }
    .can span { color: #6b7280; }
    .can[hidden] { display: none; }
    a.btn {
      display: block;
      margin-top: 18px;
      padding: 13px;
      border-radius: 10px;
      background: #2563eb;
      color: #fff;
      font-weight: 600;
      text-decoration: none;
    }
    a[hidden] { display: none; }
  </style>
</head>
<body>
  <!-- Сюда ведёт кнопка «Войти» в сообщении бота. Подтверждает вход скрипт, а не сам
       переход: ссылки заранее открывают антивирусы и фильтры, и без человека вход
       подтверждаться не должен. -->
  <main>
    <svg class="ic" id="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
         stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
      <circle cx="12" cy="12" r="10" /><path d="M12 6v6l4 2" />
    </svg>
    <h1 id="title">Подтверждаем вход…</h1>
    <p id="note">Секунду</p>
    <ul class="can" id="can" hidden>
      <li><b>Сканируйте чеки</b><span>Товары сами распределятся по категориям</span></li>
      <li><b>Смотрите, куда уходят деньги</b><span>По категориям, магазинам и товарам</span></li>
      <li><b>Ведите бюджет вместе</b><span>Пригласите семью — траты будут общими</span></li>
    </ul>
    <a class="btn" id="go" href="/m/" hidden>Открыть Чекер</a>
  </main>

  <script type="module">
    import { pendingLogin, forgetLogin, waitLogin } from '/shared/tglogin.js';

    const $ = (id) => document.getElementById(id);
    const ICONS = {
      ok: '<circle cx="12" cy="12" r="10"/><path d="m9 12 2 2 4-4"/>',
      bad: '<circle cx="12" cy="12" r="10"/><path d="m15 9-6 6"/><path d="m9 9 6 6"/>',
    };

    function show(kind, title, note, href = null, { welcome = false, button = 'Открыть Чекер' } = {}) {
      $('ic').innerHTML = ICONS[kind] ?? ICONS.ok;
      $('ic').setAttribute('class', `ic ${kind}`);
      $('title').textContent = title;
      $('note').textContent = note;
      $('can').hidden = !welcome;
      $('go').hidden = !href;
      $('go').textContent = button;
      if (href) $('go').href = href;
    }

    /** Вход состоялся: здороваемся и показываем, что теперь можно. */
    const welcome = (client) =>
      show('ok', 'Вы вошли!', 'Чекер запомнит ваши траты и покажет, на что уходят деньги.',
        appOf(client), { welcome: true, button: 'Начать' });

    const appOf = (client) => (client === 'cabinet' ? '/cabinet/' : '/m/');
    const code = new URLSearchParams(location.search).get('c');
    // Вход начат в этом же браузере — страница сама заберёт токен и откроет Чекер
    const pending = pendingLogin();

    try {
      if (!code) throw new Error('В ссылке нет кода подтверждения');
      const res = await fetch('/api/auth/telegram/confirm-link', {
        method: 'POST',
        headers: { 'content-type': 'application/json' },
        body: JSON.stringify({ code, nonce: pending?.nonce ?? null }),
      });
      const data = await res.json().catch(() => ({}));
      if (!res.ok) throw new Error(data.error ?? `HTTP ${res.status}`);

      if (!data.ok) {
        show(data.done ? 'ok' : 'bad', data.done ? 'Уже готово' : 'Не получилось', data.reply, appOf(data.client));
      } else if (data.link) {
        show('ok', 'Telegram привязан', 'Теперь в Чекер можно входить через Telegram.', appOf(data.client), { button: 'Готово' });
      } else if (data.same && pending) {
        show('ok', 'Входим…', 'Вход подтверждён');
        waitLogin(pending.nonce, {
          // Токен у нас — дальше человек начинает пользоваться отсюда
          onDone: (login) => {
            localStorage.setItem('checker.token', login.token);
            welcome(data.client);
          },
          // Токен успела забрать вкладка, где начат вход, — она уже внутри
          onFail: () => welcome(data.client),
        });
      } else {
        forgetLogin();
        welcome(data.client);
      }
    } catch (err) {
      show('bad', 'Не получилось', err.message, '/m/');
    }
  </script>
</body>
</html>
