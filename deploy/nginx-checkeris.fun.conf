# /etc/nginx/sites-available/checkeris.fun
#
# HTTP-версия: работает до того, как домен переедет на этот сервер.
# TLS-блок добавляется certbot'ом после смены A-записи, см. docs/deploy.md.
#
# default_server: сервер выделен под этот проект, поэтому обслуживаем любой Host —
# и домен, и обращение по IP. Так кабинет можно проверить до переключения DNS,
# не перечисляя адреса в конфиге. Стандартный сайт nginx при этом отключается.

server {
    listen 80 default_server;
    server_name checkeris.fun www.checkeris.fun _;

    access_log /var/log/nginx/checkeris.access.log;
    error_log  /var/log/nginx/checkeris.error.log;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # Лендинг отдаётся статикой напрямую
    root /opt/checker/site;
    index index.html;

    location / {
        try_files $uri $uri/ =404;
    }

    # Пароль проверяет приложение, а не nginx: телефону нужен токен, который можно
    # выдать и отозвать. Отсюда basic auth снят — вёрстка кабинета открыта, а данные
    # закрыты: без токена любой /api/ отвечает 401.
    location /cabinet {
        try_files $uri $uri/ /cabinet/index.html;
    }

    location /api/ {
        proxy_pass http://127.0.0.1:8788;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }
}
