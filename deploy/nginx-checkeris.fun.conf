# /etc/nginx/sites-available/checkeris.fun
#
# HTTP-версия: работает до того, как домен переедет на этот сервер.
# Обращение по IP тоже сюда — чтобы проверить кабинет, не трогая DNS.
# TLS-блок добавляется certbot'ом после смены A-записи, см. docs/deploy.md.

server {
    listen 80;
    server_name checkeris.fun www.checkeris.fun 95.163.220.218;

    access_log /var/log/nginx/checkeris.access.log;
    error_log  /var/log/nginx/checkeris.error.log;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # Лендинг отдаётся статикой напрямую
    root /opt/checker/site;
    index index.html;

    location / {
        try_files $uri $uri/ =404;
    }

    # Кабинет и API — под паролем: внутри личные чеки
    location /cabinet {
        auth_basic "Checker";
        auth_basic_user_file /etc/nginx/.htpasswd-checker;
        try_files $uri $uri/ /cabinet/index.html;
    }

    location /api/ {
        auth_basic "Checker";
        auth_basic_user_file /etc/nginx/.htpasswd-checker;

        proxy_pass http://127.0.0.1:8788;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }
}
